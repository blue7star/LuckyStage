<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>现场抽奖</title>
<link rel="stylesheet" href="/screen.css">
<link rel="stylesheet" href="/live.css">
</head>
<body>
<canvas id="atmosphere" aria-hidden="true"></canvas>
<div class="scene" aria-hidden="true"></div>
<main class="live-shell">
  <header class="live-top">
    <div class="live-brand">
      <img class="brand-logo" id="event-logo" alt="活动 Logo" hidden>
      <span class="brand-gem" id="brand-gem"><i></i></span>
      <div class="brand-copy"><strong id="event-title">现场抽奖</strong><small>LUCKY DRAW · LIVE</small></div>
    </div>
    <div class="live-meta">
      <span class="live-pill"><i></i><span id="connection-status">正在连接活动…</span></span>
      <span id="event-date"></span>
    </div>
  </header>
  <section class="live-stage">
    <div class="live-heading">
      <p class="event-kicker" id="round-label">准备开始</p>
      <h1 id="prize-name">等待抽奖</h1>
      <p class="live-count" id="prize-count"></p>
    </div>
    <div class="winner-zone" id="winner-zone" data-count="0" aria-live="polite"></div>
    <p class="live-status" id="status-text">由主持人在管理台发起抽奖</p>
  </section>
  <footer class="live-foot">
    <span class="foot-count">已揭晓 <strong id="winner-total">00</strong> 位幸运儿</span>
    <span class="foot-names" id="winner-names"></span>
  </footer>
</main>
<script src="/screen.js"></script>
<script src="/live.js"></script>
</body></html>
