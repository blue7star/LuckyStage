<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>现场抽奖</title><link rel="stylesheet" href="/live.css"></head>
<body><main id="stage" class="stage"><div class="glow glow-a"></div><div class="glow glow-b"></div>
  <header class="stage-header"><div class="brand"><img id="event-logo" class="event-logo" alt="活动 Logo">✦ <span>LUCKY DRAW</span></div><div id="event-date" class="stage-date"></div></header>
  <div class="stage-content"><div class="main-stage"><p class="pretitle">幸运时刻 · 共同见证</p><h1 id="event-title">现场抽奖</h1><div class="ornament">✦ ━━━━━ ✦</div>
    <p id="round-name" class="round-name">准备开始</p><h2 id="prize-name">等待抽奖</h2>
    <div id="spotlight" class="spotlight"><span id="winner-display">好运即将揭晓</span></div>
    <div id="draw-state" class="draw-state">由主持人在管理台发起抽奖</div></div>
    <aside class="result-panel"><div class="panel-title">活动现场 <span>LIVE</span></div><div class="people-count"><small>已参与人数</small><strong id="participant-count">—</strong></div><h3>中奖名单</h3><div id="winner-list" class="winner-list"><p class="no-winner">等待第一位幸运者</p></div></aside></div>
  <footer class="stage-footer"><span id="connection-status">正在连接活动…</span><span>愿好运与每一位参与者同行</span></footer>
</main><script src="/live.js"></script></body></html>
